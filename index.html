<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="https://www.helloimg.com/i/2026/07/23/6a61dd20aa3fc.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PARITA · 集成工业</title>
<style>
  /* ===== 设计令牌 ===== */
  :root {
    --paper: #e8e8e2;
    --panel: #f2f2ec;
    --sunk: #dcddd6;
    --line: #d8d9d5;
    --line-2: #b6b8b3;
    --ink: #101110;
    --ink-2: #4a4c48;
    --ink-3: #898d89;
    --signal: #fff500;

    --font-display: "Arial Narrow", "Segoe UI", sans-serif;
    --font-body: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;

    --dock-h: 72px;
    --side-w: 72px;

    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 黄色擦除加载 ===== */
  .wipe {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--signal);
    transform: scaleX(1); transform-origin: left;
    animation: wipeOut 0.9s cubic-bezier(0.76, 0, 0.24, 1) 0.3s forwards;
    pointer-events: none;
  }
  @keyframes wipeOut {
    to { transform: scaleX(0); transform-origin: right; }
  }

  /* ===== 页面容器 ===== */
  .page {
    position: fixed;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    will-change: opacity, transform;
  }

  #pageHome {
    z-index: 10;
    opacity: 1;
    transform: translateX(0);
  }

  #pageDoc {
    z-index: 20;
    opacity: 0;
    transform: translateX(100%);
    pointer-events: none;
  }

  body.doc-mode #pageHome {
    opacity: 0;
    transform: translateX(-15%);
    pointer-events: none;
  }
  body.doc-mode #pageDoc {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  /* ===== 首页英雄区 ===== */
  .hero {
    position: relative;
    min-height: calc(100vh - var(--dock-h));
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 4rem 3rem;
  }
  .hero-media {
    position: absolute; inset: 0;
    background: var(--sunk);
    clip-path: polygon(0 0, 100% 0, 100% 88%, 0 100%);
  }
  .hero-media::after {
    content: '';
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(16,17,16,0.03) 2px, rgba(16,17,16,0.03) 4px),
      linear-gradient(135deg, transparent 60%, rgba(255,245,0,0.18));
  }
  .hero-index {
    position: absolute; top: 2rem; right: 3rem;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 8rem;
    line-height: 1;
    color: var(--line);
    user-select: none;
    pointer-events: none;
  }
  .hero-title {
    position: relative;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(3rem, 8vw, 7rem);
    letter-spacing: -0.02em;
    line-height: 0.95;
    color: var(--ink);
    max-width: 14ch;
  }
  .hero-title .accent-bar {
    display: block;
    width: 80px; height: 6px;
    background: var(--signal);
    margin-bottom: 0.4em;
  }
  .hero-meta {
    position: relative;
    display: flex; gap: 2rem; margin-top: 2rem;
    font-size: 0.8rem; color: var(--ink-2);
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .hero-meta span::before {
    content: '◆';
    color: var(--signal);
    margin-right: 0.5em;
    font-size: 0.6em;
    vertical-align: middle;
  }

  /* ===== 操作坞 ===== */
  .dock {
    position: fixed;
    background: var(--ink);
    display: flex;
    z-index: 400;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .dock {
    bottom: 0; left: 0; right: 0;
    height: var(--dock-h);
    flex-direction: row;
    align-items: stretch;
  }

  .dock-btn {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    gap: 0.75rem;
    background: transparent;
    border: none;
    border-right: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.7);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color 0.2s;
    position: relative;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  .dock-btn:last-child { border-right: none; }

  .dock-btn::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 0;
    background: var(--signal);
    transition: width 0.3s cubic-bezier(0.76, 0, 0.24, 1);
    z-index: 0;
  }
  .dock-btn:hover::before { width: 100%; }
  .dock-btn:hover { color: var(--ink); }
  .dock-btn span { position: relative; z-index: 1; }
  .dock-btn .dot {
    width: 6px; height: 6px;
    background: var(--signal);
    display: inline-block;
    position: relative; z-index: 1;
  }
  .dock-btn:hover .dot { background: var(--ink); }

  body.doc-mode .dock {
    transform: translateY(100%);
  }

  /* ===== 文档页 ===== */
  .doc-topbar {
    position: sticky; top: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.25rem 2.5rem;
    padding-top: calc(1.25rem + var(--safe-top));
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    z-index: 10;
  }
  .doc-back {
    display: inline-flex; align-items: center; gap: 0.6rem;
    background: transparent;
    border: 1px solid var(--line-2);
    padding: 0.55em 1.1em;
    color: var(--ink-2);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .doc-back:hover {
    background: var(--ink);
    color: var(--signal);
    border-color: var(--ink);
  }
  .doc-topbar-label {
    font-family: var(--font-display);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: flex; align-items: center; gap: 0.6rem;
  }
  .doc-topbar-label::before {
    content: '';
    width: 16px; height: 3px;
    background: var(--signal);
  }

  .doc-content {
    max-width: 780px;
    margin: 0 auto;
    padding: 5rem 3rem 8rem;
    padding-bottom: calc(8rem + var(--safe-bottom));
  }

  /* ★ 编号行：编号在左，按钮在右 */
  .doc-header-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .doc-index {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 5rem;
    line-height: 0.9;
    color: var(--signal);
    -webkit-text-stroke: 1px var(--ink);
    flex-shrink: 0;
  }

  .doc-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin-bottom: 2rem;
    color: var(--ink);
  }

  .doc-divider {
    width: 100%; height: 1px;
    background: var(--line-2);
    margin-bottom: 3rem;
  }

  .doc-body p {
    font-size: 1.05rem;
    line-height: 2;
    color: var(--ink-2);
    margin-bottom: 1.5em;
  }
  .doc-body h3 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.3rem;
    letter-spacing: 0.02em;
    margin-top: 3rem;
    margin-bottom: 1rem;
    display: flex; align-items: center; gap: 0.75rem;
  }
  .doc-body h3::before {
    content: '';
    width: 20px; height: 3px;
    background: var(--signal);
    flex-shrink: 0;
  }
  .doc-body ul {
    list-style: none;
    margin-bottom: 1.5em;
  }
  .doc-body li {
    padding: 0.9em 0;
    border-bottom: 1px solid var(--line);
    color: var(--ink-2);
    font-size: 0.95rem;
    line-height: 1.7;
    display: flex; gap: 1rem;
  }
  .doc-body li::before {
    content: '◆';
    color: var(--signal);
    font-size: 0.7em;
    flex-shrink: 0;
    margin-top: 0.35em;
  }

  /* ===== 跳转按钮 ===== */
  .doc-cta {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    padding: 1em 2em;
    background: var(--signal);
    border: 1px solid var(--signal);
    color: var(--ink);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .doc-cta:hover {
    background: var(--ink);
    color: var(--signal);
    border-color: var(--ink);
  }
  .doc-cta:hover .arrow {
    transform: translate(4px, -4px);
  }
  .doc-cta .arrow {
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .doc-cta-top {
    flex-shrink: 0;
    margin-bottom: 0.4rem;
  }

  /* ===== 底部 CTA 区域 ===== */
  .doc-footer {
    margin-top: 4rem;
    padding-top: 3rem;
    border-top: 1px solid var(--line-2);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 1.5rem;
  }
  .doc-footer-label {
    font-family: var(--font-display);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: flex; align-items: center; gap: 0.6rem;
  }
  .doc-footer-label::before {
    content: '';
    width: 16px; height: 3px;
    background: var(--signal);
  }

  /* ===== 文档正文里的行内超链接 ===== */
  .doc-body p a,
  .doc-body li a:not(.link-grid a) {
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    padding: 0.1em 0.3em;
    margin: 0 -0.1em;
    background-image: linear-gradient(var(--signal), var(--signal));
    background-repeat: no-repeat;
    background-position: 0 100%;
    background-size: 100% 0.35em;
    transition: background-size 0.25s cubic-bezier(0.76, 0, 0.24, 1),
                color 0.2s ease;
    cursor: pointer;
  }
  .doc-body p a:hover,
  .doc-body li a:not(.link-grid a):hover {
    background-size: 100% 100%;
    color: var(--ink);
  }

  /* ============================================================
     ★ 链接网格：导航页专用
     ============================================================ */
  .doc-body .link-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1px;
    background: var(--line-2);
    border: 1px solid var(--line-2);
    margin: 1.5rem 0 2.5rem;
  }

  .doc-body .link-grid a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.4em 1.5em;
    background: var(--panel);
    color: var(--ink);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.05em;
    text-decoration: none;
    /* 覆盖行内超链接的荧光笔 */
    background-image: none !important;
    margin: 0;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* 左侧信号黄竖条 */
  .doc-body .link-grid a::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--signal);
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform 0.25s cubic-bezier(0.76, 0, 0.24, 1);
  }

  .doc-body .link-grid a:hover {
    background: var(--ink);
    color: var(--signal);
    background-size: auto !important;
  }

  .doc-body .link-grid a:hover::before {
    transform: scaleY(1);
  }

  .doc-body .link-grid a .grid-arrow {
    font-size: 0.9em;
    opacity: 0.5;
    transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.25s ease;
    flex-shrink: 0;
  }

  .doc-body .link-grid a:hover .grid-arrow {
    transform: translate(3px, -3px);
    opacity: 1;
  }

  /* ============================================================
     移动端
     ============================================================ */
  @media (max-width: 768px) {
    .dock {
      top: 0;
      bottom: 0;
      left: 0;
      right: auto;
      width: var(--side-w);
      height: auto;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-left: var(--safe-left);
    }

    .dock-btn {
      flex: 1;
      border-right: none;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      padding: 0.5rem 0;
    }
    .dock-btn:last-child { border-bottom: none; }

    .dock-btn::before {
      left: 0; right: 0; top: 0;
      width: 100%;
      height: 0;
      bottom: auto;
      transition: height 0.3s cubic-bezier(0.76, 0, 0.24, 1);
    }
    .dock-btn:hover::before,
    .dock-btn:active::before {
      height: 100%;
      width: 100%;
    }

    body.doc-mode .dock {
      transform: translateX(-100%);
    }

    .hero {
      padding: 3rem 1.5rem;
      padding-left: calc(1.5rem + var(--side-w));
      min-height: 100vh;
      min-height: calc(100vh - var(--safe-bottom));
    }
    .hero-index { font-size: 4rem; top: 1rem; right: 1.5rem; }

    .doc-topbar {
      padding: 1rem 1.5rem;
      padding-top: calc(1rem + var(--safe-top));
    }
    .doc-content {
      padding: 3rem 1.5rem 6rem;
      padding-bottom: calc(6rem + var(--safe-bottom));
    }

    .doc-header-row {
      flex-direction: column;
      align-items: flex-start;
      gap: 1.2rem;
      margin-bottom: 1.5rem;
    }
    .doc-index { font-size: 3.5rem; }
    .doc-cta-top { margin-bottom: 0; }

    /* 移动端网格单列 */
    .doc-body .link-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 480px) {
    :root { --side-w: 62px; }
    .dock-btn { font-size: 0.55rem; }
    .doc-content { padding-left: 1.25rem; padding-right: 1.25rem; }
    .doc-topbar { padding-left: 1.25rem; padding-right: 1.25rem; }
    .doc-cta { font-size: 0.7rem; padding: 0.85em 1.6em; }
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--paper); }
  ::-webkit-scrollbar-thumb { background: var(--line-2); }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
</style>
</head>

    contact: {

  const body = document.body;
  const docTopLabel = document.getElementById('docTopLabel');
  const docIndex = document.getElementById('docIndex');
  const docTitle = document.getElementById('docTitle');
  const docBody = document.getElementById('docBody');
  const docCtaTop = document.getElementById('docCtaTop');
  const docCtaTopText = document.getElementById('docCtaTopText');
  const docCta = document.getElementById('docCta');
  const docCtaText = document.getElementById('docCtaText');
  const docBack = document.getElementById('docBack');
  const pageDoc = document.getElementById('pageDoc');

  function enterDoc(key) {
    const d = DOCS[key];
    if (!d) return;

    docTopLabel.textContent = d.label;
    docIndex.textContent = d.index;
    docTitle.textContent = d.title;
    docBody.innerHTML = d.body;

    const text = d.ctaText || '跳转';
    docCtaTopText.textContent = text;
    docCtaText.textContent = text;

    if (d.link) {
      docCtaTop.href = d.link;
      docCtaTop.style.display = 'inline-flex';
      docCta.href = d.link;
      docCta.style.display = 'inline-flex';
    } else {
      docCtaTop.style.display = 'none';
      docCta.style.display = 'none';
    }

    body.classList.add('doc-mode');
    pageDoc.scrollTop = 0;
  }

  function exitDoc() {
    body.classList.remove('doc-mode');
  }

  document.querySelectorAll('.dock-btn').forEach(btn => {
    btn.addEventListener('click', () => enterDoc(btn.dataset.key));
  });

  docBack.addEventListener('click', exitDoc);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && body.classList.contains('doc-mode')) {
      exitDoc();
    }
  });

})();
</script>
