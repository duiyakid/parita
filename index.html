<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duiyakid 的导航站</title>
    <style>
        /* 全局样式重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* 页面背景和布局 */
        body {
            background-color: #f4f6f8;
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 40px;
            animation: fadeIn 0.6s ease-out;
        }

        /* 标题部分 */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 1rem;
        }

        /* 卡片网格布局 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        /* 单个卡片样式 */
        .card {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border-color: #d0d0d0;
            background: #ffffff;
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 10px;
            color: #2c3e50;
        }

        .card p {
            font-size: 0.9rem;
            color: #7f8c8d;
            line-height: 1.5;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        .card .btn {
            display: inline-block;
            background-color: #3498db;
            color: #fff;
            text-align: center;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .card:hover .btn {
            background-color: #2980b9;
        }

        /* 页脚 */
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.85rem;
            color: #aaa;
        }

        /* 简单的淡入动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🚀 我的导航站</h1>
            <p>欢迎来到 parita.vip，在这里快速找到我的各个站点和教程</p>
        </header>

        <main class="card-grid">
            <!-- 卡片 1：博客 -->
            <a href="https://duiyakid.github.io/parita/" class="card" target="_blank" rel="noopener">
                <h2>📝 我的博客</h2>
                <p>记录我的学习笔记、技术心得和生活感悟。</p>
                <span class="btn">访问博客 &rarr;</span>
            </a>

            <!-- 卡片 2：Astro 教程（如果你想写教程，可以放这里） -->
            <a href="/tutorials/astro.html" class="card" target="_blank" rel="noopener">
                <h2>📖 Astro 建站教程</h2>
                <p>从零开始搭建 Astro 静态网站，并部署到 GitHub Pages。</p>
                <span class="btn">阅读教程 &rarr;</span>
            </a>

            <!-- 卡片 3：关于我 -->
            <a href="/about.html" class="card" target="_blank" rel="noopener">
                <h2>👤 关于我</h2>
                <p>了解更多关于我的信息，以及如何联系我。</p>
                <span class="btn">了解更多 &rarr;</span>
            </a>

            <!-- 卡片 4：自定义跳转（示例：你可以把外部工具放这里） -->
            <a href="https://github.com/duiyakid" class="card" target="_blank" rel="noopener">
                <h2>💻 GitHub</h2>
                <p>查看我的开源项目和代码仓库。</p>
                <span class="btn">前往 GitHub &rarr;</span>
            </a>
        </main>

        <footer>
            <p>&copy; 2024 Duiyakid. All rights reserved.</p>
        </footer>
    </div>

</body>
</html>
